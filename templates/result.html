<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽籤結果</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #400000;
            color: #ffffff;
        }
        .result-container {
            text-align: center;
        }
        .result-container h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .result-container a {
            color: #ffffff;
            font-size: 24px;
            text-decoration: none;
            background-color: #007bff;
            padding: 10px 20px;
            border-radius: 10px;
            transition: background-color 0.3s;
        }
        .result-container a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <h1>中獎號碼是：<span id="resultNumber">{{ result }}</span></h1>
        <a href="{{ url_for('number_roulette') }}">返回重新抽籤</a>
    </div>
</body>
</html>
