name: Deploy Flask App to Local IIS Folder

on:
  push:
    branches: [main]  # 每次 push 到 main 就部署

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to E:\Deploy\Roulette (handle robocopy exit code)
        shell: powershell
        run: |
          $source = "$PWD"
          $target = "E:\Deploy\Roulette"
          $excludeDirs = @(".git", ".github", "__pycache__")
          $excludeFiles = @("*.pyc", "*.pyo") # web.config 也會被複製，所以不排除

          robocopy $source $target /MIR `
            /XD $excludeDirs `
            /XF $excludeFiles `
            /NFL /NDL /NJH /NJS

          if ($LASTEXITCODE -gt 1) {
            Write-Error "❌ Robocopy failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          } else {
            Write-Host "✅ Robocopy completed with exit code $LASTEXITCODE"
          }
