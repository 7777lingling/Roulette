name: Deploy Flask App to Local IIS Folder

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to E:\Deploy\Roulette (PowerShell 內建)
        shell: powershell
        run: |
          $source = "$PWD"
          $target = "E:\Deploy\Roulette"
          $excludeDirs = @(".git", ".github", "__pycache__")
          $excludeFiles = @("*.pyc", "*.pyo")

          robocopy $source $target /MIR `
            /XD $excludeDirs `
            /XF $excludeFiles `
            /NFL /NDL /NJH /NJS

          if ($LASTEXITCODE -ge 8) {
            Write-Error "❌ Robocopy failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          } else {
            Write-Host "✅ Robocopy completed with exit code $LASTEXITCODE"
          }
