name: Deploy Flask App to Local IIS Folder

on:
  push:
    branches: [main]  # 每次 push 到 main 就部署

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Publish Project
        run: dotnet publish ./WS105/WS105.csproj -c Release -o ./publish

      - name: Deploy to IIS (copy to E:\Deploy\Roulette)
        run: |
          robocopy ./publish "E:\Deploy\Roulette" /MIR /XD logs obj bin /NFL /NDL /NJH /NJS